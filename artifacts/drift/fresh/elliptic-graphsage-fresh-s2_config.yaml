name: elliptic-graphsage-fresh-s2
data:
  root: data/elliptic
  train_time_steps:
  - 1
  - 43
  val_time_steps:
  - 44
  - 44
  test_time_steps:
  - 45
  - 49
  local_features_only: false
  standardise: true
  to_undirected: true
  add_self_loops: false
  force_reload: false
model:
  name: graphsage
  hidden_channels: 128
  num_layers: 3
  dropout: 0.3
  heads: 4
  jumping_knowledge: true
  residual: true
  batch_norm: true
train:
  epochs: 300
  learning_rate: 0.005
  weight_decay: 0.0005
  class_weight: balanced
  illicit_weight_multiplier: 1.0
  early_stopping_patience: 40
  monitor: illicit_f1
  grad_clip_norm: 1.0
  lr_scheduler_patience: 15
  seed: 2
  device: auto
  checkpoint_dir: artifacts/drift/fresh
  log_every: 10
