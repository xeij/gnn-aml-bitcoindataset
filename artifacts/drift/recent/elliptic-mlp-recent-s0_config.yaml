name: elliptic-mlp-recent-s0
data:
  root: data/elliptic
  train_time_steps:
  - 1
  - 38
  val_time_steps:
  - 39
  - 42
  test_time_steps:
  - 43
  - 49
  local_features_only: false
  standardise: true
  to_undirected: true
  add_self_loops: false
  force_reload: false
model:
  name: mlp
  hidden_channels: 128
  num_layers: 3
  dropout: 0.3
  heads: 4
  jumping_knowledge: true
  residual: true
  batch_norm: true
train:
  epochs: 300
  learning_rate: 0.005
  weight_decay: 0.0005
  class_weight: balanced
  illicit_weight_multiplier: 1.0
  early_stopping_patience: 40
  monitor: illicit_f1
  grad_clip_norm: 1.0
  lr_scheduler_patience: 15
  seed: 0
  device: auto
  checkpoint_dir: artifacts/drift/recent
  log_every: 10
